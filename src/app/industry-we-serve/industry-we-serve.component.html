
<section style="margin-top: 55px;">
  <h1 class="main-container">Industry We Serve</h1>
  <div class=" main-container industry-grid-container">

 <mat-card  class="industry-card"*ngFor="let item of industry; let i = index">
  <img  class="industry-content"[src]="item.image" >
  <div class="description">{{ item.desc }}</div>
  <div class="details">
  <ul>
    <li *ngFor="let detail of item.list">{{ detail }}</li>
  </ul>
</div>
 </mat-card>
 
</div>
</section>
