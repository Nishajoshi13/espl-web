
<mat-dialog-content style="padding:0px">
  <div class="video-container">
    <iframe
      width="100%"
      height="450"
      [src]="videoUrl "  
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
    ></iframe>
  </div>
</mat-dialog-content>
