<div @dialogAnimation class="background">
  <!-- Modal container with accessible name -->
  <div class="cross">
    <mat-icon mat-dialog-close aria-label="Close dialog">close</mat-icon>
  </div>
  
  <div  class="contact-us-mail">
    <img src="\assets\images\general\mail.webp" alt="mail image showing contact information">
  </div>
  
  <div class="container" aria-labelledby="dialog-title">
    <!-- Modal Title -->
    <h2 id="dialog-title" class="heading">Let's Build Your Online Presence</h2>

    <!-- Name Input -->
    <div>
      <mat-form-field class="form">
        <mat-label for="firstName">Name</mat-label> 
        <!-- Accessible label for Name -->
        <input
          matInput
          placeholder="Name"
          [formControl]="firstName"
          (blur)="updateNameError()"
          required
          id="firstName"
        />
        <mat-error *ngIf="firstName.invalid">{{ nameError }}</mat-error>
      </mat-form-field>
    </div>

    <!-- Email Input -->
    <div>
      <mat-form-field class="form">
        <mat-label for="email">Email</mat-label> 
        <input
          matInput
          placeholder="Email"
          [formControl]="email"
          (blur)="updateMailError()"
          required
          id="email"
        />
        <mat-error *ngIf="email.invalid">{{ mailError }}</mat-error>
      </mat-form-field>
    </div>

    <!-- Preference Checkbox -->
    <div>
      <label for="preference">
        <input type="checkbox" [formControl]="preference" name="preference" id="preference" />
        Save Preference
      </label>
    </div>

    <!-- Message Display -->
    <p>{{ message }}</p>

    <!-- Connect Button -->
    <div class="outer-container">
      <div class="button-container">
        <a>
          <button class="transparent-btn" (click)="sendEmail($event)">Let's Connect</button>
        </a>
      </div>
    </div>
  </div>
</div>
